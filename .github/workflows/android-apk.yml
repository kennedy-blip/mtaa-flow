name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Capacitor Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build offline web bundle
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage universal APK
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             apk-out/mtaaflow-v1.2.0-universal.apk
          ls -lh apk-out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtaaflow-apk
          path: apk-out/mtaaflow-v1.2.0-universal.apk
          if-no-files-found: error
          retention-days: 30

      # Publish the compiled binary back into the source branch so the web app's
      # "Download Android APK" button serves a real, installable package from /apk/.
      - name: Publish APK into app download directory
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "MtaaFlow CI"
          git config user.email "ci@mtaaflow.co.ke"
          git fetch origin "$HEAD_REF"
          git checkout -B apk-publish "origin/$HEAD_REF"
          mkdir -p public/apk
          cp apk-out/mtaaflow-v1.2.0-universal.apk public/apk/mtaaflow-v1.2.0-universal.apk
          git add -f public/apk/mtaaflow-v1.2.0-universal.apk
          if git diff --cached --quiet; then
            echo "APK binary unchanged - nothing to publish."
          else
            git commit -m "build(apk): publish compiled universal Android package [skip ci]"
            git push origin HEAD:"$HEAD_REF"
          fi
